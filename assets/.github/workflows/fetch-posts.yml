name: Fetch Beehiiv posts on: schedule: - cron: "0 6 * * *" workflow_dispatch: {} permissions: contents: write jobs: fetch: runs-on: ubuntu-latest steps: - name: Check out repo uses: actions/checkout@v4 - name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" - name: Fetch Beehiiv feed run: python scripts/fetch_posts.py - name: Commit changes if any run: | git config user.name "cardinal-bot" git config user.email "actions@users.noreply.github.com" git add data/posts.json git diff --staged --quiet || git commit -m "Update commentary posts from Beehiiv" git push
